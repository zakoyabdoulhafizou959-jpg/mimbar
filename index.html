<!DOCTYPE html>
<html lang="fr" class="h-full bg-zinc-950 text-white select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MinbarStream - Version Simple</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-full bg-slate-900 flex justify-center items-center overflow-hidden font-sans">

<div class="w-full h-full max-w-[480px] bg-zinc-950 flex flex-col relative overflow-hidden">

    <header class="bg-zinc-900 px-4 pt-6 pb-3 border-b border-zinc-800/80 flex justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-cyan-400 to-emerald-500 p-1 flex items-center justify-center">
                <i class="fa-solid fa-play text-white text-xs"></i>
            </div>
            <h1 class="text-sm font-bold text-white">Minbar<span class="text-orange-500">Stream</span></h1>
        </div>
        <div class="bg-zinc-800/80 px-2 py-1 rounded-full text-[10px]">
            <i class="fa-solid fa-user-check text-orange-500"></i>
            <span id="header-user-status">Déconnecté</span>
        </div>
    </header>

    <div class="flex-1 overflow-y-auto pb-24" id="main-content">
        
        <!-- ACCUEIL -->
        <div id="tab-home" class="p-4 space-y-4">
            <input type="text" id="searchInput" oninput="filterVideos()" placeholder="Rechercher..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full py-2 px-4 text-sm text-white">
            
            <div id="videosList" class="space-y-3"></div>
        </div>

        <!-- TELECHARGEMENTS -->
        <div id="tab-downloads" class="hidden p-4">
            <h2 class="text-lg font-bold text-white mb-3">📥 Téléchargements</h2>
            <div id="downloadsList" class="space-y-3"></div>
        </div>

        <!-- PROFIL -->
        <div id="tab-profile" class="hidden p-4 space-y-4">
            <div id="loginPanel" class="space-y-3">
                <div class="text-center py-6 bg-zinc-900 rounded-2xl">
                    <i class="fa-solid fa-user text-3xl text-zinc-600"></i>
                    <h3 class="text-sm font-bold mt-2">Connectez-vous</h3>
                </div>
                <button onclick="handleGoogleLogin()" class="w-full py-3 bg-white text-zinc-950 rounded-xl font-bold flex gap-2 justify-center">
                    <i class="fa-brands fa-google text-red-500"></i> Google
                </button>
                <input type="email" id="email" placeholder="Email" class="w-full bg-zinc-800 rounded-xl px-3 py-2 text-white">
                <input type="password" id="password" placeholder="Mot de passe" class="w-full bg-zinc-800 rounded-xl px-3 py-2 text-white">
                <button onclick="login()" class="w-full py-2 bg-orange-500 rounded-xl font-bold">Se connecter</button>
                <button onclick="signup()" class="w-full py-2 bg-zinc-800 rounded-xl">Créer un compte</button>
            </div>
            
            <div id="userInfo" class="hidden space-y-4">
                <div class="flex justify-between bg-zinc-900 p-4 rounded-2xl">
                    <div><p class="font-bold text-white" id="userName"></p><p class="text-xs text-zinc-400" id="userEmail"></p></div>
                    <button onclick="logout()" class="text-xs text-red-400">Déconnexion</button>
                </div>
                
                <div class="bg-zinc-900 rounded-2xl p-4">
                    <h3 class="text-sm font-bold mb-2">🎥 Upload vidéo</h3>
                    <input type="file" id="videoFile" accept="video/*" class="hidden" onchange="uploadVideo()">
                    <button onclick="document.getElementById('videoFile').click()" class="w-full py-2 bg-orange-500/20 rounded-xl text-orange-400">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Choisir une vidéo
                    </button>
                    <div id="uploadProgress" class="hidden mt-2"><div class="h-1 bg-orange-500 rounded-full" style="width:0%"></div><p class="text-xs text-center mt-1" id="progressPercent">0%</p></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="absolute bottom-0 left-0 right-0 bg-zinc-900 border-t border-zinc-800 py-3 flex justify-around">
        <button onclick="showTab('home')" id="btn-home" class="text-orange-500"><i class="fa-solid fa-house text-xl"></i><span class="text-[10px] block">Accueil</span></button>
        <button onclick="showTab('downloads')" id="btn-downloads" class="text-zinc-500"><i class="fa-solid fa-download text-xl"></i><span class="text-[10px] block">Downloads</span></button>
        <button onclick="showTab('profile')" id="btn-profile" class="text-zinc-500"><i class="fa-solid fa-user text-xl"></i><span class="text-[10px] block">Profil</span></button>
    </nav>

    <!-- Player Modal -->
    <div id="playerModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col">
        <div class="bg-black p-4 flex justify-between">
            <button onclick="closePlayer()" class="text-white"><i class="fa-solid fa-arrow-left text-xl"></i></button>
            <h3 id="playerTitle" class="text-white text-sm">Lecture</h3>
            <div class="w-8"></div>
        </div>
        <video id="playerVideo" class="w-full flex-1" controls autoplay></video>
    </div>
</div>

<script>
    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyC3ybM8gMQZ-IjVLLXqs0MZLPEzqGmyREA",
        authDomain: "mimbar-e1bee.firebaseapp.com",
        projectId: "mimbar-e1bee",
        storageBucket: "mimbar-e1bee.firebasestorage.app",
        messagingSenderId: "287190157826",
        appId: "1:287190157826:web:c1fd927c6cf0ea0ecdb51b"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;
    
    // URLs Backblaze B2 (vos vidéos)
    const BACKBLAZE_VIDEOS = [
        { id: 1, title: "Vidéo 1 - Cours", speaker: "Cheikh Ousmane", url: "https://f005.backblazeb2.com/file/minbar-media/VideoConverter_30_06_2024_12_12_26.mp4" },
        { id: 2, title: "Vidéo 2 - Rappel", speaker: "Imam Mamadou", url: "https://f005.backblazeb2.com/file/minbar-media/WhatsApp%20Video%202026-06-05%20at%2014.52.40.mp4" },
        { id: 3, title: "Vidéo 3 - Méditation", speaker: "Ustadha Fatima", url: "https://f005.backblazeb2.com/file/minbar-media/WhatsApp%20Video%202026-06-05%20at%2014.58.10.mp4" }
    ];

    let userVideos = [];
    let downloads = JSON.parse(localStorage.getItem('downloads') || '[]');

    // Auth
    auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        if (user) {
            document.getElementById('header-user-status').innerText = user.email?.split('@')[0];
            document.getElementById('userName').innerText = user.email?.split('@')[0];
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('loginPanel').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            await loadUserVideos();
        } else {
            document.getElementById('header-user-status').innerText = 'Déconnecté';
            document.getElementById('loginPanel').classList.remove('hidden');
            document.getElementById('userInfo').classList.add('hidden');
        }
        showVideos();
    });

    async function loadUserVideos() {
        if (!currentUser) return;
        const snapshot = await db.collection('videos').where('userId', '==', currentUser.uid).get();
        userVideos = [];
        snapshot.forEach(doc => userVideos.push({ id: doc.id, ...doc.data() }));
    }

    // Upload vers Firebase Storage (simple et fonctionnel)
    async function uploadVideo() {
        const fileInput = document.getElementById('videoFile');
        if (!fileInput.files.length) return;
        
        const file = fileInput.files[0];
        const progressDiv = document.getElementById('uploadProgress');
        const progressBar = progressDiv.querySelector('div');
        const progressPercent = document.getElementById('progressPercent');
        
        progressDiv.classList.remove('hidden');
        
        const storageRef = storage.ref().child(`videos/${Date.now()}_${file.name}`);
        const uploadTask = storageRef.put(file);
        
        uploadTask.on('state_changed', 
            (snapshot) => {
                const percent = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                progressBar.style.width = `${percent}%`;
                progressPercent.innerText = `${Math.round(percent)}%`;
            },
            (error) => { alert("Erreur: " + error.message); progressDiv.classList.add('hidden'); },
            async () => {
                const url = await storageRef.getDownloadURL();
                await db.collection('videos').add({
                    userId: currentUser.uid,
                    title: file.name,
                    url: url,
                    date: new Date().toISOString(),
                    views: 0
                });
                progressDiv.classList.add('hidden');
                fileInput.value = '';
                await loadUserVideos();
                showVideos();
                alert("✅ Vidéo uploadée !");
            }
        );
    }

    // Afficher les vidéos (Backblaze + uploads utilisateur)
    function showVideos() {
        const container = document.getElementById('videosList');
        let allVideos = [...BACKBLAZE_VIDEOS];
        
        if (currentUser) {
            allVideos.push(...userVideos.map(v => ({
                id: v.id,
                title: v.title,
                speaker: "Moi",
                url: v.url
            })));
        }
        
        if (allVideos.length === 0) {
            container.innerHTML = '<div class="text-center text-zinc-500 py-8">Aucune vidéo</div>';
            return;
        }
        
        container.innerHTML = allVideos.map(v => `
            <div class="bg-zinc-900 p-3 rounded-2xl flex justify-between items-center">
                <div class="flex gap-3 flex-1">
                    <div class="w-12 h-12 rounded-xl bg-zinc-800 flex items-center justify-center">
                        <i class="fa-solid fa-play text-orange-500"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-white">${v.title}</h4>
                        <p class="text-xs text-orange-500">${v.speaker || "Imam"}</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="playVideo('${v.url}', '${v.title}')" class="px-3 py-1 bg-zinc-800 rounded-lg text-white">
                        <i class="fa-solid fa-play"></i>
                    </button>
                    <button onclick="downloadVideo('${v.url}', '${v.title}.mp4')" class="px-3 py-1 bg-orange-500 rounded-lg text-white">
                        <i class="fa-solid fa-download"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    function filterVideos() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const items = document.querySelectorAll('#videosList > div');
        items.forEach(item => {
            const title = item.querySelector('h4')?.innerText.toLowerCase() || '';
            item.style.display = title.includes(search) ? 'flex' : 'none';
        });
    }

    // Lecture vidéo
    function playVideo(url, title) {
        const modal = document.getElementById('playerModal');
        const video = document.getElementById('playerVideo');
        document.getElementById('playerTitle').innerText = title;
        video.src = url;
        modal.classList.remove('hidden');
        video.play().catch(e => console.log(e));
    }

    // Téléchargement SIMPLE avec <a> tag (pas de fetch CORS)
    function downloadVideo(url, filename) {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.target = "_blank";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        downloads.unshift({ title: filename, date: new Date().toLocaleString() });
        localStorage.setItem('downloads', JSON.stringify(downloads));
        showDownloads();
    }

    function showDownloads() {
        const container = document.getElementById('downloadsList');
        if (downloads.length === 0) {
            container.innerHTML = '<div class="text-center text-zinc-500 py-8">Aucun téléchargement</div>';
            return;
        }
        container.innerHTML = downloads.map(d => `
            <div class="bg-zinc-900 p-3 rounded-xl">
                <p class="text-white">📹 ${d.title}</p>
                <p class="text-xs text-zinc-500">📅 ${d.date}</p>
            </div>
        `).join('');
    }

    function closePlayer() {
        const modal = document.getElementById('playerModal');
        const video = document.getElementById('playerVideo');
        video.pause();
        modal.classList.add('hidden');
    }

    // Auth
    async function login() {
        const email = document.getElementById('email').value;
        const pwd = document.getElementById('password').value;
        try { await auth.signInWithEmailAndPassword(email, pwd); showTab('home'); } 
        catch(e) { alert(e.message); }
    }
    
    async function signup() {
        const email = document.getElementById('email').value;
        const pwd = document.getElementById('password').value;
        if (pwd.length < 6) { alert("6 caractères minimum"); return; }
        try { await auth.createUserWithEmailAndPassword(email, pwd); showTab('home'); } 
        catch(e) { alert(e.message); }
    }
    
    async function handleGoogleLogin() {
        try { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); showTab('home'); } 
        catch(e) { alert(e.message); }
    }
    
    function logout() { auth.signOut(); showTab('profile'); }

    function showTab(tab) {
        document.getElementById('tab-home').classList.add('hidden');
        document.getElementById('tab-downloads').classList.add('hidden');
        document.getElementById('tab-profile').classList.add('hidden');
        document.getElementById(`tab-${tab}`).classList.remove('hidden');
        
        document.getElementById('btn-home').classList.toggle('text-orange-500', tab === 'home');
        document.getElementById('btn-home').classList.toggle('text-zinc-500', tab !== 'home');
        document.getElementById('btn-downloads').classList.toggle('text-orange-500', tab === 'downloads');
        document.getElementById('btn-downloads').classList.toggle('text-zinc-500', tab !== 'downloads');
        document.getElementById('btn-profile').classList.toggle('text-orange-500', tab === 'profile');
        document.getElementById('btn-profile').classList.toggle('text-zinc-500', tab !== 'profile');
        
        if (tab === 'downloads') showDownloads();
    }

    showTab('home');
</script>
</body>
</html>
