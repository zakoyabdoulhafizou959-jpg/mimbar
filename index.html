<script>
// ============================================
// 🔥 FIREBASE
// ============================================
const firebaseConfig = {
    apiKey: "AIzaSyC3ybM8gMQZ-IjVLLXqs0MZLPEzqGmyREA",
    authDomain: "mimbar-e1bee.firebaseapp.com",
    projectId: "mimbar-e1bee",
    storageBucket: "mimbar-e1bee.appspot.com",
    messagingSenderId: "287190157826",
    appId: "1:287190157826:web:c1fd927c6cf0ea0ecdb51b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ').replace(/\r/g, '');
}

// ============================================
// 📊 ÉTAT
// ============================================
let currentUser = null;
let userAlbum = null;
let allVideos = [];
let allAlbums = [];
let selectedAlbumFilter = null;
let selectionMode = false;
let selectedVideoIds = new Set();
let currentPlayingVideo = null;
let currentSelectedFile = null;
let completedDownloads = JSON.parse(localStorage.getItem('completedDownloads') || '[]');
let activeDownloads = JSON.parse(localStorage.getItem('activeDownloads') || '[]');

// ============================================
// 🔐 AUTH
// ============================================
auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (user) {
        document.getElementById('header-user-status').textContent = user.email?.split('@')[0] || 'Connecté';
        await loadUserData();
    } else {
        document.getElementById('header-user-status').textContent = 'Déconnecté';
        userAlbum = null;
    }
    updateProfileUI();
    await loadAllAlbums();
    await loadAllVideos();
    renderAll();
});

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    if (!email || !email.includes('@')) { alert("Email valide requis"); return; }
    if (pwd.length < 6) { alert("Mot de passe min 6 caractères"); return; }
    try { await auth.signInWithEmailAndPassword(email, pwd); showTab('home'); }
    catch(e) { alert("Erreur: " + e.message); }
}

async function handleSignup() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    if (!email || !email.includes('@')) { alert("Email valide requis"); return; }
    if (pwd.length < 6) { alert("Mot de passe min 6 caractères"); return; }
    try { await auth.createUserWithEmailAndPassword(email, pwd); showTab('home'); }
    catch(e) { alert("Erreur: " + e.message); }
}

async function handleGoogleSignIn() {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        showTab('home');
    } catch(e) { alert("Erreur Google: " + e.message); }
}

function handleLogout() { auth.signOut(); showTab('profile'); }

// ============================================
// 📚 DONNÉES FIREBASE
// ============================================
async function loadUserData() {
    if (!currentUser) return;
    try {
        const albumQuery = await db.collection('albums').where('userId', '==', currentUser.uid).limit(1).get();
        if (!albumQuery.empty) {
            userAlbum = { id: albumQuery.docs[0].id, ...albumQuery.docs[0].data() };
        } else {
            // Créer automatiquement un album par défaut
            const newAlbum = await db.collection('albums').add({
                userId: currentUser.uid,
                name: 'Mon Album',
                description: '',
                createdAt: new Date()
            });
            userAlbum = { id: newAlbum.id, name: 'Mon Album' };
        }
    } catch(e) { console.log("Erreur album:", e); }
}

async function loadAllAlbums() {
    try {
        const snapshot = await db.collection('albums').get();
        allAlbums = [];
        snapshot.forEach(doc => {
            allAlbums.push({ id: doc.id, ...doc.data() });
        });
    } catch(e) { console.error("Erreur albums:", e); }
}

async function loadAllVideos() {
    try {
        const snapshot = await db.collection('videos').get();
        allVideos = [];
        snapshot.forEach(doc => {
            const v = doc.data();
            allVideos.push({
                id: doc.id,
                albumId: v.albumId,
                userId: v.userId,
                title: v.title || 'Sans titre',
                speaker: v.speaker || 'Inconnu',
                duration: v.duration || "00:00",
                date: v.date || new Date().toISOString().split('T')[0],
                views: v.views || 0,
                downloads: v.downloads || 0,
                videoUrl: v.downloadURL,
                thumbnail: v.thumbnail || '',
                size: v.size || 0
            });
        });
    } catch(e) { 
        console.error("Erreur vidéos:", e);
    }
}

function updateProfileUI() {
    const unauth = document.getElementById('profile-unauth');
    const authDiv = document.getElementById('profile-auth');
    const myalbumUnauth = document.getElementById('myalbum-unauth');
    const myalbumContent = document.getElementById('myalbum-content');
    
    if (!currentUser) {
        unauth.classList.remove('hidden');
        authDiv.classList.add('hidden');
        myalbumUnauth.classList.remove('hidden');
        myalbumContent.classList.add('hidden');
        return;
    }
    
    unauth.classList.add('hidden');
    authDiv.classList.remove('hidden');
    myalbumUnauth.classList.add('hidden');
    myalbumContent.classList.remove('hidden');
    
    document.getElementById('userName').innerText = currentUser.email?.split('@')[0] || 'User';
    document.getElementById('userEmail').innerText = currentUser.email || '';
    document.getElementById('userAvatar').innerText = (currentUser.email?.charAt(0) || 'U').toUpperCase();
    
    const myVids = allVideos.filter(v => v.userId === currentUser.uid);
    document.getElementById('statVideos').innerText = myVids.length;
    document.getElementById('statViews').innerText = myVids.reduce((s, v) => s + (v.views || 0), 0);
    document.getElementById('statDownloads').innerText = completedDownloads.length;
    
    if (userAlbum) {
        document.getElementById('my-album-title').innerText = userAlbum.name || 'Mon Album';
        document.getElementById('my-videos-count').innerText = myVids.length;
        document.getElementById('my-album-views').innerText = myVids.reduce((s, v) => s + (v.views || 0), 0);
        renderMyVideos();
    }
}

// ============================================
// 🎬 UPLOAD (TITRE + VIDÉO)
// ============================================
function handleFileSelected(input) {
    if (!input.files?.length) return;
    currentSelectedFile = input.files[0];
    
    if (!currentUser) { alert("Connectez-vous d'abord"); input.value = ''; return; }
    if (!userAlbum) { alert("Album non trouvé"); input.value = ''; return; }
    if (currentSelectedFile.size > 50 * 1024 * 1024) { 
        alert("Max 50 Mo"); 
        input.value = ''; 
        return; 
    }
    
    document.getElementById('selected-file-name').innerText = currentSelectedFile.name;
    document.getElementById('videoTitle').value = currentSelectedFile.name.replace(/\.[^/.]+$/, "");
    document.getElementById('upload-form').classList.remove('hidden');
}

function cancelFileSelection() {
    currentSelectedFile = null;
    document.getElementById('videoUpload').value = '';
    document.getElementById('upload-form').classList.add('hidden');
}

// Générer une miniature depuis la vidéo
async function generateThumbnail(file) {
    return new Promise((resolve) => {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.playsInline = true;
        
        video.onloadeddata = () => {
            video.currentTime = Math.min(2, video.duration / 2);
        };
        
        video.onseeked = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 180;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const thumbnail = canvas.toDataURL('image/jpeg', 0.6);
            resolve(thumbnail);
        };
        
        video.onerror = () => resolve('');
        video.src = URL.createObjectURL(file);
    });
}

async function uploadVideoToB2() {
    if (!currentSelectedFile) return;
    
    const title = document.getElementById('videoTitle').value.trim();
    if (!title) { alert("Titre requis"); return; }
    
    const progressDiv = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    
    progressDiv.classList.remove('hidden');
    progressBar.style.width = '0%';
    progressText.innerText = '0% - Génération miniature...';
    
    try {
        // Générer la miniature
        const thumbnail = await generateThumbnail(currentSelectedFile);
        
        progressText.innerText = '10% - Envoi...';
        
        const fileName = `${Date.now()}_${currentSelectedFile.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
        
        const xhr = new XMLHttpRequest();
        
        const uploadPromise = new Promise((resolve, reject) => {
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = 10 + (e.loaded / e.total) * 80;
                    progressBar.style.width = `${percent}%`;
                    progressText.innerText = `${Math.round(percent)}% - ${(e.loaded / 1024 / 1024).toFixed(1)}/${(e.total / 1024 / 1024).toFixed(1)} Mo`;
                }
            });
            
            xhr.onload = () => {
                if (xhr.status === 200) resolve(JSON.parse(xhr.responseText));
                else {
                    try { reject(new Error(JSON.parse(xhr.responseText).error || `Erreur ${xhr.status}`)); }
                    catch { reject(new Error(`Erreur ${xhr.status}`)); }
                }
            };
            xhr.onerror = () => reject(new Error('Erreur réseau'));
            
            xhr.open('POST', '/api/upload-b2');
            xhr.setRequestHeader('X-Bz-File-Name', fileName);
            xhr.setRequestHeader('Content-Type', currentSelectedFile.type || 'application/octet-stream');
            xhr.send(currentSelectedFile);
        });
        
        const result = await uploadPromise;
        
        progressBar.style.width = '95%';
        progressText.innerText = '95% - Sauvegarde...';
        
        await db.collection('videos').add({
            userId: currentUser.uid,
            albumId: userAlbum.id,
            fileName: currentSelectedFile.name,
            title: title,
            speaker: currentUser.email?.split('@')[0] || 'Utilisateur',
            duration: "00:00",
            date: new Date().toISOString().split('T')[0],
            views: 0,
            downloads: 0,
            downloadURL: result.downloadUrl,
            thumbnail: thumbnail,
            uploadedAt: new Date(),
            size: currentSelectedFile.size,
            storage: 'backblaze_b2'
        });
        
        progressBar.style.width = '100%';
        progressText.innerText = '✅ Terminé !';
        
        setTimeout(() => {
            progressDiv.classList.add('hidden');
            document.getElementById('upload-form').classList.add('hidden');
            document.getElementById('videoUpload').value = '';
            currentSelectedFile = null;
        }, 1500);
        
        await loadAllVideos();
        updateProfileUI();
        renderAll();
        
        alert("✅ Vidéo publiée !");
        
    } catch(error) {
        console.error("❌ Erreur:", error);
        alert("Erreur: " + error.message);
        progressDiv.classList.add('hidden');
    }
}

// ============================================
// 📥 TÉLÉCHARGEMENT
// ============================================
async function downloadVideo(url, filename, videoId) {
    const downloadId = 'dl_' + Date.now();
    activeDownloads.push({ id: downloadId, title: filename, url: url, progress: 0 });
    localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
    renderDownloads();
    
    try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Erreur: ' + response.status);
        
        const contentLength = response.headers.get('content-length');
        const total = contentLength ? parseInt(contentLength) : 0;
        let loaded = 0;
        
        const reader = response.body.getReader();
        const chunks = [];
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            
            if (total > 0) {
                const percent = (loaded / total) * 100;
                const dl = activeDownloads.find(d => d.id === downloadId);
                if (dl) {
                    dl.progress = percent;
                    localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
                    renderDownloads();
                }
            }
        }
        
        const blob = new Blob(chunks);
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
        
        activeDownloads = activeDownloads.filter(d => d.id !== downloadId);
        completedDownloads.unshift({ title: filename, date: new Date().toLocaleString(), size: (blob.size / 1024 / 1024).toFixed(2) + ' Mo' });
        localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
        localStorage.setItem('completedDownloads', JSON.stringify(completedDownloads));
        
        // Incrémenter compteur
        if (videoId) {
            try {
                await db.collection('videos').doc(videoId).update({
                    downloads: firebase.firestore.FieldValue.increment(1)
                });
            } catch(e) {}
        }
        
        renderDownloads();
        updateProfileUI();
        
    } catch(e) {
        console.error('Erreur:', e);
        activeDownloads = activeDownloads.filter(d => d.id !== downloadId);
        localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
        renderDownloads();
        alert("❌ Erreur CORS");
    }
}

function downloadCurrentVideo() {
    if (currentPlayingVideo) {
        downloadVideo(currentPlayingVideo.videoUrl, currentPlayingVideo.title + '.mp4', currentPlayingVideo.id);
    }
}

// ============================================
// ✅ SÉLECTION MULTIPLE
// ============================================
function toggleSelectionMode() {
    selectionMode = !selectionMode;
    selectedVideoIds.clear();
    
    const btn = document.getElementById('btn-select-mode');
    const bar = document.getElementById('selection-bar');
    
    if (selectionMode) {
        btn.innerHTML = '<i class="fa-solid fa-xmark mr-1"></i>Annuler';
        btn.style.background = '#ff5722';
        bar.classList.remove('hidden');
    } else {
        btn.innerHTML = '<i class="fa-regular fa-square-check mr-1"></i>Sélectionner';
        btn.style.background = '';
        bar.classList.add('hidden');
    }
    
    updateSelectedCount();
    renderMyVideos();
}

function toggleVideoSelection(videoId) {
    if (selectedVideoIds.has(videoId)) {
        selectedVideoIds.delete(videoId);
    } else {
        selectedVideoIds.add(videoId);
    }
    updateSelectedCount();
    renderMyVideos();
}

function updateSelectedCount() {
    document.getElementById('selected-count').innerText = selectedVideoIds.size;
}

async function downloadSelected() {
    if (selectedVideoIds.size === 0) { alert("Aucune vidéo sélectionnée"); return; }
    
    const videos = allVideos.filter(v => selectedVideoIds.has(v.id));
    alert(`Téléchargement de ${videos.length} vidéo(s)...`);
    
    for (const v of videos) {
        await downloadVideo(v.videoUrl, v.title + '.mp4', v.id);
        await new Promise(r => setTimeout(r, 500));
    }
    
    toggleSelectionMode();
}

async function deleteSelected() {
    if (selectedVideoIds.size === 0) { alert("Aucune vidéo sélectionnée"); return; }
    if (!confirm(`Supprimer ${selectedVideoIds.size} vidéo(s) ?`)) return;
    
    for (const id of selectedVideoIds) {
        try { await db.collection('videos').doc(id).delete(); } catch(e) {}
    }
    
    selectedVideoIds.clear();
    await loadAllVideos();
    updateProfileUI();
    renderMyVideos();
    renderVideoGrid();
    toggleSelectionMode();
}

async function deleteMyVideo(videoId) {
    if (!confirm("Supprimer cette vidéo ?")) return;
    try {
        await db.collection('videos').doc(videoId).delete();
        await loadAllVideos();
        updateProfileUI();
        renderMyVideos();
        renderVideoGrid();
    } catch(e) { alert("Erreur: " + e.message); }
}

// ============================================
// 🎬 LECTEUR
// ============================================
function openVideoPlayer(url, title, speaker, videoId) {
    currentPlayingVideo = allVideos.find(v => v.id === videoId) || { videoUrl: url, title, speaker, id: videoId };
    
    document.getElementById('video-player-title').innerText = title;
    document.getElementById('video-player-speaker').innerText = speaker;
    const video = document.getElementById('native-video');
    const source = document.getElementById('video-source');
    source.src = url;
    video.load();
    document.getElementById('video-overlay-player').classList.remove('hidden');
    video.play().catch(e => console.log(e));
    
    // Incrémenter vues
    if (videoId) {
        db.collection('videos').doc(videoId).update({
            views: firebase.firestore.FieldValue.increment(1)
        }).catch(e => {});
    }
}

function closeVideoPlayer() { 
    document.getElementById('video-overlay-player').classList.add('hidden'); 
    document.getElementById('native-video').pause();
    document.getElementById('native-video').src = '';
    currentPlayingVideo = null;
}

// ============================================
// 📥 DOWNLOADS UI
// ============================================
function renderDownloads() {
    const activeList = document.getElementById('active-downloads-list');
    const completedList = document.getElementById('completed-downloads-list');
    const badge = document.getElementById('download-count-badge');
    
    if (badge) badge.innerText = `${activeDownloads.length}`;
    
    if (activeDownloads.length === 0) {
        activeList.innerHTML = '<div class="text-center text-zinc-500 py-8 text-xs">Aucun téléchargement</div>';
    } else {
        activeList.innerHTML = activeDownloads.map(d => `
            <div class="bg-zinc-900 p-3 rounded-xl space-y-2">
                <div class="flex justify-between items-center">
                    <p class="text-xs font-bold text-white truncate">📹 ${escapeAttr(d.title)}</p>
                    <button onclick="cancelDownload('${d.id}')" class="w-6 h-6 bg-red-900/30 text-red-400 rounded flex items-center justify-center">
                        <i class="fa-solid fa-xmark text-xs"></i>
                    </button>
                </div>
                <div class="relative h-1.5 bg-zinc-700 rounded-full overflow-hidden">
                    <div class="absolute inset-y-0 left-0" style="width: ${d.progress}%;background:linear-gradient(to right,#ff5722,#00e676)"></div>
                </div>
                <p class="text-[10px] text-zinc-400 text-right">${Math.round(d.progress)}%</p>
            </div>
        `).join('');
    }
    
    completedList.innerHTML = completedDownloads.length ? completedDownloads.map(d => `
        <div class="bg-zinc-900 p-3 rounded-xl text-white">
            <p class="text-xs font-bold">📹 ${escapeAttr(d.title)}</p>
            <p class="text-[9px] text-zinc-500">📅 ${escapeAttr(d.date)} · ${escapeAttr(d.size || '')}</p>
        </div>
    `).join('') : '<div class="text-center text-zinc-500 py-8">Aucun téléchargement</div>';
}

function cancelDownload(id) {
    activeDownloads = activeDownloads.filter(d => d.id !== id);
    localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
    renderDownloads();
}

function toggleDlSubTab(sub) {
    document.getElementById('dl-active-container').classList.toggle('hidden', sub !== 'active');
    document.getElementById('dl-completed-container').classList.toggle('hidden', sub !== 'completed');
    document.getElementById('btn-sub-active').className = sub === 'active' ? "px-3.5 py-1 text-xs rounded-full bg-white text-zinc-950" : "px-3.5 py-1 text-xs rounded-full bg-zinc-800 text-zinc-400";
    document.getElementById('btn-sub-completed').className = sub === 'completed' ? "px-3.5 py-1 text-xs rounded-full bg-white text-zinc-950" : "px-3.5 py-1 text-xs rounded-full bg-zinc-800 text-zinc-400";
}

// ============================================
// 🔍 FILTRES
// ============================================
function filterByAlbum(albumId) {
    selectedAlbumFilter = albumId;
    renderAlbumChips();
    renderVideoGrid();
}

function filterMedia(val) {
    const container = document.getElementById('video-grid');
    let filtered = selectedAlbumFilter ? allVideos.filter(v => v.albumId === selectedAlbumFilter) : allVideos;
    
    if (val) {
        filtered = filtered.filter(v => 
            v.title.toLowerCase().includes(val.toLowerCase()) || 
            v.speaker.toLowerCase().includes(val.toLowerCase())
        );
    }
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="text-center text-zinc-500 py-8 text-xs">Aucun résultat</div>';
        return;
    }
    
    // Réutiliser renderVideoGrid avec filtre
    const originalVideos = allVideos;
    allVideos = filtered;
    renderVideoGrid();
    allVideos = originalVideos;
}

// ============================================
// 🧭 NAVIGATION
// ============================================
function showTab(tab) {
    ['home','downloads','myalbum','profile'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.add('hidden');
        const btn = document.getElementById(`nav-${t}`);
        if (btn) btn.style.color = '#71717a';
    });
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    const activeBtn = document.getElementById(`nav-${tab}`);
    if (activeBtn) activeBtn.style.color = '#ff5722';
    
    if (tab === 'downloads') renderDownloads();
    if (tab === 'myalbum' && currentUser) {
        updateProfileUI();
        renderMyVideos();
    }
}

showTab('home');
