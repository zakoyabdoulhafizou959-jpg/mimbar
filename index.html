<script>
// ============================================

// ============================================
firebase.initializeApp({
    apiKey: "AIzaSyC3ybM8gMQZ-IjVLLXqs0MZLPEzqGmyREA",
    authDomain: "mimbar-e1bee.firebaseapp.com",
    projectId: "mimbar-e1bee",
    storageBucket: "mimbar-e1bee.appspot.com",
    messagingSenderId: "287190157826",
    appId: "1:287190157826:web:c1fd927c6cf0ea0ecdb51b"
});
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================
// 🔧 UTILITAIRES

function escapeAttr(str) {
    if (!str) return '';
    return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}

// ============================================
// 📊 ÉTAT
// ============================================
let currentUser = null;
let userAlbum = null;
let userVideos = [];
let completedDownloads = JSON.parse(localStorage.getItem('completedDownloads') || '[]');
let activeDownloads = JSON.parse(localStorage.getItem('activeDownloads') || '[]');

const EXISTING_VIDEOS = [
    {
        id: 'b2_1',
        title: 'Video douverture',
        speaker: 'Cheikh Ousmane',
        duration: '15:24',
        size: '14.8 MB',
        views: 127,
        videoUrl: 'https://f005.backblazeb2.com/file/minbar-media/VideoConverter_30_06_2024_12_12_26.mp4'
    },
    {
        id: 'b2_2',
        title: 'Message spirituel',
        speaker: 'Imam Mamadou',
        duration: '08:32',
        size: '2.4 MB',
        views: 89,
        videoUrl: 'https://f005.backblazeb2.com/file/minbar-media/WhatsApp%20Video%202026-06-05%20at%2014.52.40.mp4'
    },
    {
        id: 'b2_3',
        title: 'Rappel du jour',
        speaker: 'Ustadha Fatima',
        duration: '12:18',
        size: '1.9 MB',
        views: 156,
        videoUrl: 'https://f005.backblazeb2.com/file/minbar-media/WhatsApp%20Video%202026-06-05%20at%2014.58.10.mp4'
    }
];

let sermonsList = [...EXISTING_VIDEOS];

// ============================================
// 🔐 AUTH
// ============================================
auth.onAuthStateChanged(async (user) => {
    currentUser = user;
    if (user) {
        document.getElementById('header-user-status').textContent = user.email?.split('@')[0] || 'Connecté';
        await loadUserData();
    } else {
        document.getElementById('header-user-status').textContent = 'Déconnecté';
        userAlbum = null;
        userVideos = [];
        updateProfileUI();
    }
    await loadAllSermons();
    renderSermons();
});

async function handleLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    if (!email || !email.includes('@')) { alert("Email valide requis"); return; }
    if (pwd.length < 6) { alert("Mot de passe min 6 caractères"); return; }
    try {
        await auth.signInWithEmailAndPassword(email, pwd);
        showTab('home');
    } catch(e) { alert("Erreur: " + e.message); }
}

async function handleSignup() {
    const email = document.getElementById('loginEmail').value.trim();
    const pwd = document.getElementById('loginPassword').value;
    if (!email || !email.includes('@')) { alert("Email valide requis"); return; }
    if (pwd.length < 6) { alert("Mot de passe min 6 caractères"); return; }
    try {
        await auth.createUserWithEmailAndPassword(email, pwd);
        showTab('home');
    } catch(e) { alert("Erreur: " + e.message); }
}

async function handleGoogleSignIn() {
    try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await auth.signInWithPopup(provider);
        showTab('home');
    } catch(e) { alert("Erreur Google: " + e.message); }
}

function handleLogout() { auth.signOut(); showTab('profile'); }

// ============================================
// 📚 DONNÉES
// ============================================
async function loadUserData() {
    if (!currentUser) return;
    try {
        const albumQuery = await db.collection('albums').where('userId', '==', currentUser.uid).get();
        if (!albumQuery.empty) {
            userAlbum = { id: albumQuery.docs[0].id, ...albumQuery.docs[0].data() };
            const videosQuery = await db.collection('videos').where('userId', '==', currentUser.uid).get();
            userVideos = [];
            videosQuery.forEach(doc => userVideos.push({ id: doc.id, ...doc.data() }));
        } else {
            userAlbum = null;
        }
    } catch(e) { console.log("Erreur:", e); }
    updateProfileUI();
}

async function loadAllSermons() {
    try {
        const snapshot = await db.collection('videos').get();
        const firestoreVideos = [];
        snapshot.forEach(doc => {
            const v = doc.data();
            firestoreVideos.push({
                id: doc.id,
                title: v.title,
                speaker: v.speaker || 'Inconnu',
                duration: v.duration || "00:00",
                views: v.views || 0,
                videoUrl: v.downloadURL,
                size: v.size ? (v.size / 1024 / 1024).toFixed(1) + ' MB' : '0 MB'
            });
        });
        sermonsList = [...EXISTING_VIDEOS, ...firestoreVideos];
    } catch(e) { 
        sermonsList = [...EXISTING_VIDEOS];
    }
}

function updateProfileUI() {
    document.getElementById('profile-unauth').classList.add('hidden');
    document.getElementById('profile-auth-no-album').classList.add('hidden');
    document.getElementById('profile-auth-with-album').classList.add('hidden');
    
    if (!currentUser) {
        document.getElementById('profile-unauth').classList.remove('hidden');
    } else if (!userAlbum) {
        document.getElementById('profile-auth-no-album').classList.remove('hidden');
        document.getElementById('userName1').innerText = currentUser.email?.split('@')[0] || 'User';
        document.getElementById('userEmail1').innerText = currentUser.email || '';
    } else {
        document.getElementById('profile-auth-with-album').classList.remove('hidden');
        document.getElementById('userName2').innerText = currentUser.email?.split('@')[0] || 'User';
        document.getElementById('albumNameDisplay').innerText = userAlbum.name || 'Mon Album';
    }
}

async function createAlbum() {
    const name = document.getElementById('albumName').value.trim();
    const desc = document.getElementById('albumDesc').value.trim();
    if (!name) { alert("Nom requis"); return; }
    try {
        await db.collection('albums').add({ 
            userId: currentUser.uid, name, description: desc, createdAt: new Date() 
        });
        await loadUserData();
        alert("Album créé !");
    } catch(e) { alert("Erreur: " + e.message); }
}

// ============================================
// ☁️ UPLOAD B2 VIA VERCEL PROXY
// ============================================
async function uploadVideoToB2(input) {
    if (!input.files?.length) return;
    const file = input.files[0];
    
    if (!currentUser) { alert("Connectez-vous d'abord"); input.value = ''; return; }
    if (!userAlbum) { alert("Créez un album d'abord"); input.value = ''; return; }
    if (file.size > 100 * 1024 * 1024) { alert("Max 100 Mo"); input.value = ''; return; }
    
    const progressDiv = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const progressDetail = document.getElementById('progressDetail');
    
    progressDiv.classList.remove('hidden');
    progressBar.style.width = '0%';
    progressText.innerText = '0%';
    progressDetail.innerText = 'Préparation...';
    
    try {
        // ÉTAPE 1: Proxy Vercel
        progressText.innerText = '10%';
        progressDetail.innerText = 'Connexion à B2...';
        
        const proxyResponse = await fetch('/api/upload-b2', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        });
        
        if (!proxyResponse.ok) {
            const errorData = await proxyResponse.json().catch(() => ({}));
            throw new Error('Erreur proxy: ' + (errorData.error || proxyResponse.status));
        }
        
        const { uploadUrl, authorizationToken, downloadUrl } = await proxyResponse.json();
        
        // ÉTAPE 2: Upload direct vers B2
        progressText.innerText = '20%';
        progressDetail.innerText = 'Envoi vers B2...';
        
        const fileName = `${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.-]/g, '_')}`;
        
        await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = 20 + (e.loaded / e.total) * 70;
                    progressBar.style.width = `${percent}%`;
                    progressText.innerText = `${Math.round(percent)}%`;
                    progressDetail.innerText = `Envoi: ${(e.loaded / 1024 / 1024).toFixed(1)} Mo / ${(e.total / 1024 / 1024).toFixed(1)} Mo`;
                }
            });
            
            xhr.onload = () => {
                if (xhr.status === 200) {
                    resolve(JSON.parse(xhr.responseText));
                } else {
                    reject(new Error('Upload B2 échoué: ' + xhr.status));
                }
            };
            
            xhr.onerror = () => reject(new Error('Erreur réseau'));
            xhr.ontimeout = () => reject(new Error('Timeout'));
            
            xhr.open('POST', uploadUrl);
            xhr.setRequestHeader('Authorization', authorizationToken);
            xhr.setRequestHeader('X-Bz-File-Name', encodeURIComponent(fileName));
            xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
            xhr.setRequestHeader('X-Bz-Content-Sha1', 'do_not_verify');
            xhr.timeout = 600000; // 10 minutes
            
            xhr.send(file);
        });
        
        // ÉTAPE 3: Firestore
        progressText.innerText = '95%';
        progressDetail.innerText = 'Sauvegarde métadonnées...';
        
        const publicUrl = downloadUrl + encodeURIComponent(fileName);
        
        await db.collection('videos').add({
            userId: currentUser.uid,
            albumId: userAlbum.id,
            fileName: file.name,
            title: file.name.replace(/\.[^/.]+$/, ""),
            speaker: currentUser.email?.split('@')[0] || 'Utilisateur',
            duration: "00:00",
            date: new Date().toISOString().split('T')[0],
            views: 0,
            downloads: 0,
            downloadURL: publicUrl,
            uploadedAt: new Date(),
            size: file.size,
            storage: 'backblaze_b2'
        });
        
        progressBar.style.width = '100%';
        progressText.innerText = '100%';
        progressDetail.innerText = '✅ Terminé !';
        
        setTimeout(() => {
            progressDiv.classList.add('hidden');
            progressBar.style.width = '0%';
        }, 2000);
        
        input.value = '';
        await loadAllSermons();
        await loadUserData();
        renderSermons();
        
        alert("✅ Vidéo téléversée sur B2 avec succès !");
        
    } catch(error) {
        console.error("❌ Erreur upload:", error);
        alert("Erreur upload: " + error.message);
        progressDiv.classList.add('hidden');
        input.value = '';
    }
}

// ============================================
// 📥 TÉLÉCHARGEMENT
// ============================================
async function downloadVideo(url, filename) {
    const downloadId = 'dl_' + Date.now();
    activeDownloads.push({ id: downloadId, title: filename, url, progress: 0 });
    localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
    renderDownloads();
    
    try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Erreur: ' + response.status);
        
        const contentLength = response.headers.get('content-length');
        const total = contentLength ? parseInt(contentLength) : 0;
        let loaded = 0;
        
        const reader = response.body.getReader();
        const chunks = [];
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            loaded += value.length;
            
            if (total > 0) {
                const percent = (loaded / total) * 100;
                const dl = activeDownloads.find(d => d.id === downloadId);
                if (dl) {
                    dl.progress = percent;
                    localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
                    renderDownloads();
                }
            }
        }
        
        const blob = new Blob(chunks);
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 100);
        
        activeDownloads = activeDownloads.filter(d => d.id !== downloadId);
        completedDownloads.unshift({ 
            title: filename, 
            date: new Date().toLocaleString(),
            size: (blob.size / 1024 / 1024).toFixed(2) + ' Mo'
        });
        
        localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
        localStorage.setItem('completedDownloads', JSON.stringify(completedDownloads));
        
        renderDownloads();
        alert("✅ Téléchargement terminé !");
        
    } catch(e) {
        console.error('Erreur:', e);
        activeDownloads = activeDownloads.filter(d => d.id !== downloadId);
        localStorage.setItem('activeDownloads', JSON.stringify(activeDownloads));
        renderDownloads();
        alert("❌ Erreur CORS. Configurez CORS sur B2.");
    }
}

// ============================================
// 🎨 RENDU
// ============================================
function renderSermons() {
    const container = document.getElementById('sermons-list');
    if (sermonsList.length === 0) { 
        container.innerHTML = '<div class="text-center text-zinc-500 py-8">Aucun prêche</div>'; 
        return; 
    }
    container.innerHTML = sermonsList.map(s => {
        const safeUrl = escapeAttr(s.videoUrl);
        const safeTitle = escapeAttr(s.title);
        const safeSpeaker = escapeAttr(s.speaker);
        return `
        <div class="bg-zinc-900 p-3 rounded-2xl flex justify-between items-center">
            <div class="flex gap-3 flex-1 min-w-0 cursor-pointer" onclick="openVideoPlayer('${safeUrl}', '${safeTitle}', '${safeSpeaker}')">
                <div class="w-12 h-12 rounded-xl bg-zinc-800 flex items-center justify-center shrink-0"><i class="fa-solid fa-play text-orange-500"></i></div>
                <div class="min-w-0">
                    <h4 class="text-xs font-bold truncate">${s.title}</h4>
                    <p class="text-[9px] text-orange-500">${s.speaker}</p>
                    <div class="flex gap-2 text-[8px] text-zinc-500">
                        <span>${s.duration}</span>
                        <span>${s.size}</span>
                        <span>${s.views} vues</span>
                    </div>
                </div>
            </div>
            <button onclick="event.stopPropagation(); downloadVideo('${safeUrl}', '${safeTitle}.mp4')" class="px-3 py-2 bg-orange-500 rounded text-xs"><i class="fa-solid fa-download"></i></button>
        </div>
        `;
    }).join('');
}

function filterMedia(val) { 
    const container = document.getElementById('sermons-list');
    let filtered = sermonsList.filter(s => s.title.toLowerCase().includes(val.toLowerCase()) || s.speaker.toLowerCase().includes(val.toLowerCase()));
    if (filtered.length === 0) { 
        container.innerHTML = '<div class="text-center text-zinc-500 py-8">Aucun résultat</div>'; 
        return; 
    }
    container.innerHTML = filtered.map(s => {
        const safeUrl = escapeAttr(s.videoUrl);
        const safeTitle = escapeAttr(s.title);
        const safeSpeaker = escapeAttr(s.speaker);
        return `
        <div class="bg-zinc-900 p-3 rounded-2xl flex justify-between items-center">
            <div class="flex gap-3 flex-1 min-w-0 cursor-pointer" onclick="openVideoPlayer('${safeUrl}', '${safeTitle}', '${safeSpeaker}')">
                <div class="w-12 h-12 rounded-xl bg-zinc-800 flex items-center justify-center"><i class="fa-solid fa-play text-orange-500"></i></div>
                <div class="min-w-0">
                    <h4 class="text-xs font-bold truncate">${s.title}</h4>
                    <p class="text-[9px] text-orange-500">${s.speaker}</p>
                </div>
            </div>
            <button onclick="event.stopPropagation(); downloadVideo('${safeUrl}', '${safeTitle}.mp4')" class="px-3 py-2 bg-orange-500 rounded text-xs"><i class="fa-solid fa-download"></i></button>
        </div>
        `;
    }).join('');
}

function openVideoPlayer(url, title, speaker) {
    document.getElementById('video-player-title').innerText = title;
    document.getElementById('video-player-speaker').innerText = speaker;
    const video = document.getElementById('native-video');
    document.getElementById('video-source').src = url;
    video.load();
    document.getElementById('video-overlay-player').classList.remove('hidden');
    video.play().catch(e => console.log(e));
}

function renderDownloads() {
    const activeList = document.getElementById('active-downloads-list');
    const completedList = document.getElementById('completed-downloads-list');
    document.getElementById('download-count-badge').innerText = `${activeDownloads.length} actif(s)`;
    
    if (activeDownloads.length === 0) {
        activeList.innerHTML = '<div class="text-center text-zinc-500 py-8 text-xs">Aucun téléchargement</div>';
    } else {
        activeList.innerHTML = activeDownloads.map(d => `
            <div class="bg-zinc-900 p-3 rounded-xl space-y-2">
                <p class="text-xs font-bold truncate">📹 ${escapeAttr(d.title)}</p>
                <div class="relative h-1.5 bg-zinc-700 rounded-full overflow-hidden">
                    <div class="absolute inset-y-0 left-0 bg-gradient-to-r from-orange-500 to-emerald-500" style="width: ${d.progress}%"></div>
                </div>
                <p class="text-[10px] text-zinc-400 text-right">${Math.round(d.progress)}%</p>
            </div>
        `).join('');
    }
    
    completedList.innerHTML = completedDownloads.length ? completedDownloads.map(d => `
        <div class="bg-zinc-900 p-3 rounded-xl">
            <p class="text-xs font-bold">📹 ${escapeAttr(d.title)}</p>
            <p class="text-[9px] text-zinc-500">📅 ${escapeAttr(d.date)} · ${escapeAttr(d.size || '')}</p>
        </div>
    `).join('') : '<div class="text-center text-zinc-500 py-8">Aucun téléchargement</div>';
}

function toggleDlSubTab(sub) {
    document.getElementById('dl-active-container').classList.toggle('hidden', sub !== 'active');
    document.getElementById('dl-completed-container').classList.toggle('hidden', sub !== 'completed');
    document.getElementById('btn-sub-active').className = sub === 'active' ? "px-3.5 py-1 text-xs rounded-full bg-white text-zinc-950" : "px-3.5 py-1 text-xs rounded-full bg-zinc-800 text-zinc-400";
    document.getElementById('btn-sub-completed').className = sub === 'completed' ? "px-3.5 py-1 text-xs rounded-full bg-white text-zinc-950" : "px-3.5 py-1 text-xs rounded-full bg-zinc-800 text-zinc-400";
}

function closeVideoPlayer() { 
    document.getElementById('video-overlay-player').classList.add('hidden'); 
    document.getElementById('native-video').pause(); 
}

function showTab(tab) {
    document.getElementById('tab-home').classList.add('hidden');
    document.getElementById('tab-downloads').classList.add('hidden');
    document.getElementById('tab-profile').classList.add('hidden');
    document.getElementById(`tab-${tab}`).classList.remove('hidden');
    ['home','downloads','profile'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (t === tab) { btn.classList.add('text-orange-500'); btn.classList.remove('text-zinc-500'); }
        else { btn.classList.add('text-zinc-500'); btn.classList.remove('text-orange-500'); }
    });
    if (tab === 'downloads') renderDownloads();
}

showTab('home');
renderDownloads();
</script>
</body>
</html>
